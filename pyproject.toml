[project]
name = "ml-tech-assessment"
version = "0.1.0"
description = "Production-grade FastAPI service for analyzing transcripts using OpenAI - Hexagonal Architecture"
authors = [
    {name = "Martin Eserios"},
    {name = "jhonvalderrama", email = "jhonvalderrama@aceup.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core API Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Data Validation & Settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.9.1",

    # LLM Integrations
    "openai>=1.76.2",
    "groq>=0.11.0",

    # HTTP Client
    "httpx>=0.27.0",

    # Environment & Configuration
    "python-dotenv>=1.0.0",

    # Logging
    "structlog>=24.4.0",

    # Security - PII Detection & Anonymization
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "spacy>=3.7.0",

    # Token Counting & Rate Limiting
    "tiktoken>=0.5.0",
    "slowapi>=0.1.9",

    # Redis for Persistence & Rate Limiting
    "redis>=5.0.0",

    # Async utilities
    "nest-asyncio>=1.5.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",

    # Code Quality
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "black>=24.10.0",

    # HTTP testing
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]  # Use app/ folder containing backend/ and frontend/

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=app.backend",  # Cover app/backend/ folder
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
branch = true
source = ["app.backend"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if __name__ == .__main__:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "__pycache__",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | node_modules
)/
'''
